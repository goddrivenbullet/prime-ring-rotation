<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>Prime Ring Rotation</title>
<!-- prime-ring-rotation-v2 -->
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#05080f;overflow:hidden;position:fixed;inset:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;overscroll-behavior:none;outline:none}
#ui{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:2;pointer-events:none}
#ui button{pointer-events:auto;background:rgba(255,255,255,.14);color:#eee;border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:10px 16px;font:17px/1 -apple-system,system-ui,sans-serif;min-width:48px;min-height:48px;-webkit-appearance:none;appearance:none}
#ui button:active{background:rgba(255,255,255,.28)}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
<button type="button" id="zm" aria-label="zoom out">−</button>
<button type="button" id="zp" aria-label="zoom in">+</button>
<button type="button" id="pp" aria-label="pause">❚❚</button>
<button type="button" id="sp" aria-label="speed">1×</button>
<button type="button" id="rv" aria-label="reset view">⟲</button>
<button type="button" id="rs" aria-label="restart">✦</button>
</div>
<script>
(function(){
'use strict';
const MARKER='prime-ring-rotation-v2';
const REPO='prime-ring-rotation-v2';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});

function isP(n){if(n<2)return false;if(n%2===0)return n===2;for(let d=3;d*d<=n;d+=2)if(n%d===0)return false;return true}

/* Precompute primes per ring: band [360k, 360k+359], skip 2,3,5 */
const MAXR=360, RING_MS=250;
const ringTh=[]; // ringTh[k] = Float32Array of θ in radians (n mod 360)
const ringCount=new Int16Array(MAXR);
(function build(){
  for(let k=0;k<MAXR;k++){
    const th=[];
    for(let m=360*k;m<360*(k+1);m++){
      if(m>5&&isP(m)) th.push((m%360)*Math.PI/180);
    }
    ringTh[k]=new Float32Array(th);
    ringCount[k]=th.length;
  }
})();

/* Geometry: unit sphere. Ring 0 = meridian in yz-plane, θ=0 at north pole (+y).
   Point: (0, cosθ, sinθ). Ring k = rotate about +y by k° CLOCKWISE from above
   (= +Ry): x=sinθ·sinα, y=cosθ, z=sinθ·cosα, α=k·π/180. */
function hueOf(k){return 330 - 285*(k/(MAXR-1));} // pink(~330) → gold(~45)

const UZ_MIN=.3,UZ_MAX=8;
let nRings=0, T=0, nextAt=0, last=0, play=true, speed=1, complete=false;
const V={yaw:.55,pitch:20*Math.PI/180,userZoom:1,fit:1.15,dragging:false,vy:0,vp:0,pinch0:0,uz0:1,midX:0,midY:0,lastTap:0};
const touches=new Map();
const hasTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

function clampUz(z){return Math.min(UZ_MAX,Math.max(UZ_MIN,z))}
function size(){const dpr=Math.min(window.devicePixelRatio||1,2.5),W=window.innerWidth||document.documentElement.clientWidth||390,H=window.innerHeight||document.documentElement.clientHeight||844;const tw=Math.max(1,Math.round(W*dpr)),th=Math.max(1,Math.round(H*dpr));if(cv.width!==tw||cv.height!==th){cv.width=tw;cv.height=th}return{dpr,W,H}}
function applyRotate(dx,dy){V.yaw+=dx*.009;V.pitch=Math.max(-1.55,Math.min(1.55,V.pitch+dy*.009));V.vy=dx*.009;V.vp=dy*.009}
function resetView(){V.userZoom=1;V.yaw=.55;V.pitch=20*Math.PI/180;V.vy=0;V.vp=0}
function restart(){nRings=0;T=0;nextAt=0;last=0;complete=false;resetView()}

function frame(now){
  requestAnimationFrame(frame);
  const{dpr,W,H}=size();
  const dt=last?Math.min(64,now-last):16;last=now;
  if(play){
    T+=dt*speed;
    while(!complete&&T>=nextAt&&nRings<MAXR){
      nRings++; nextAt+=RING_MS;
      if(nRings>=MAXR) complete=true;
    }
  }
  if(play&&!V.dragging){
    if(Math.abs(V.vy)+Math.abs(V.vp)>.00002){
      V.yaw+=V.vy; V.pitch=Math.max(-1.55,Math.min(1.55,V.pitch+V.vp));
      const damp=Math.pow(.92,dt/16); V.vy*=damp; V.vp*=damp;
    }else{
      // gentle auto-spin (faster once complete so the finished sphere turns)
      V.yaw+=(complete?.00035:.00018)*dt*Math.max(1,speed*.6);
    }
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#05080f';ctx.fillRect(0,0,W,H);

  const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch);
  const sc=.42*Math.min(W,H)*V.userZoom/V.fit;
  const D=Math.max(2.2, 4.2/Math.max(1,V.userZoom*.5));
  const near=-D*.92;
  // project world (x,y,z) → screen; return null if behind near plane
  function pr(x,y,z){
    const x1=x*cy+z*sy, z1=-x*sy+z*cy;
    const y2=y*cp-z1*sp, z2=y*sp+z1*cp;
    if(z2<=near)return null;
    const f=D/(D+z2);
    return[W/2+x1*sc*f, H/2-y2*sc*f, z2, f];
  }

  // faint polar axis (y)
  const pn=pr(0,1.05,0), ps=pr(0,-1.05,0);
  if(pn&&ps){
    ctx.strokeStyle='rgba(255,180,220,.22)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(pn[0],pn[1]);ctx.lineTo(ps[0],ps[1]);ctx.stroke();
  }
  // glowing pink core
  const pc=pr(0,0,0);
  if(pc){
    const g=ctx.createRadialGradient(pc[0],pc[1],0,pc[0],pc[1],18*pc[3]);
    g.addColorStop(0,'rgba(255,120,200,.55)');g.addColorStop(1,'rgba(255,80,160,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(pc[0],pc[1],18*pc[3],0,6.2832);ctx.fill();
    ctx.fillStyle='rgba(255,160,220,.9)';ctx.beginPath();ctx.arc(pc[0],pc[1],2.4*pc[3],0,6.2832);ctx.fill();
  }

  ctx.globalCompositeOperation='lighter';

  // Draw oldest → newest so newest sits on top. Skip glow for old rings.
  // For links: same θ on consecutive rings — sample sparsely for speed.
  const prevByTh=new Map(); // θ-key → last projected point (coarse)
  for(let k=0;k<nRings;k++){
    const ths=ringTh[k];
    const age=nRings-1-k; // 0 = newest
    const bright=age===0?1:Math.max(.12, Math.pow(.965,age));
    const hue=hueOf(k);
    const alphaDot=.18+.77*bright;
    const alphaGlow=age<3?.22*bright:0;
    const aRad=k*Math.PI/180, sa=Math.sin(aRad), ca=Math.cos(aRad);
    const cur=[];
    for(let i=0;i<ths.length;i++){
      const th=ths[i], s=Math.sin(th), c=Math.cos(th);
      // unit sphere meridian point after clockwise rotate about y by k°
      const x=s*sa, y=c, z=s*ca;
      const p=pr(x,y,z);
      if(!p){cur.push(null);continue}
      cur.push(p);
      // optional faint same-θ spoke to previous ring
      if(k>0&&age<40){
        const key=(ths[i]*1000)|0;
        const prev=prevByTh.get(key);
        if(prev){
          ctx.strokeStyle='hsla('+hue+',70%,70%,'+(0.08*bright).toFixed(3)+')';
          ctx.lineWidth=.5;ctx.beginPath();
          ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
        }
      }
      const rr=Math.max(.7,1.6*p[3]);
      if(alphaGlow>0){
        ctx.fillStyle='hsla('+hue+',95%,60%,'+alphaGlow.toFixed(3)+')';
        ctx.beginPath();ctx.arc(p[0],p[1],rr*2.4,0,6.2832);ctx.fill();
      }
      ctx.fillStyle='hsla('+hue+',95%,72%,'+alphaDot.toFixed(3)+')';
      ctx.beginPath();ctx.arc(p[0],p[1],rr,0,6.2832);ctx.fill();
    }
    // faint meridian arc (connect primes in θ order) for recent rings — makes vertical circles readable
    if(age<28){
      ctx.strokeStyle='hsla('+hue+',85%,65%,'+(0.16*bright).toFixed(3)+')';
      ctx.lineWidth=age===0?1.4:.55;
      ctx.beginPath(); let started=false;
      for(let i=0;i<cur.length;i++){
        const p=cur[i]; if(!p){started=false;continue}
        if(!started){ctx.moveTo(p[0],p[1]);started=true} else ctx.lineTo(p[0],p[1]);
      }
      ctx.stroke();
    }
    // refresh prev map for next ring (use actual θ keys)
    prevByTh.clear();
    for(let i=0;i<ths.length;i++){
      if(cur[i]) prevByTh.set((ths[i]*1000)|0, cur[i]);
    }
  }
  ctx.globalCompositeOperation='source-over';
}

/* ---- touchctl-v2 input (touch-first) ---- */
function touchList(e){const arr=[];for(let i=0;i<e.touches.length;i++){const t=e.touches[i];arr.push({id:t.identifier,x:t.clientX,y:t.clientY})}return arr}
function syncTouches(list){touches.clear();for(const t of list)touches.set(t.id,{x:t.x,y:t.y})}
function pinchDist(list){if(list.length<2)return 0;return Math.hypot(list[0].x-list[1].x,list[0].y-list[1].y)}
function midpoint(list){if(list.length<2)return{x:list[0].x,y:list[0].y};return{x:(list[0].x+list[1].x)/2,y:(list[0].y+list[1].y)/2}}

function onTouchStart(e){
  e.preventDefault();
  const list=touchList(e);
  if(list.length===1&&e.changedTouches.length===1){
    const now=performance.now();
    if(now-V.lastTap<280){resetView();V.lastTap=0} else V.lastTap=now;
  }
  V.dragging=true;V.vy=0;V.vp=0;syncTouches(list);
  if(list.length>=2){V.pinch0=pinchDist(list);V.uz0=V.userZoom;const m=midpoint(list);V.midX=m.x;V.midY=m.y}
  else if(list.length===1){V.midX=list[0].x;V.midY=list[0].y}
}
function onTouchMove(e){
  e.preventDefault();
  const list=touchList(e);if(!list.length)return;
  if(list.length>=2){
    const d=pinchDist(list);
    if(V.pinch0>0)V.userZoom=clampUz(V.uz0*(d/V.pinch0));
    const m=midpoint(list);applyRotate(m.x-V.midX,m.y-V.midY);V.midX=m.x;V.midY=m.y;
  }else{
    const t=list[0];applyRotate(t.x-V.midX,t.y-V.midY);V.midX=t.x;V.midY=t.y;
  }
  syncTouches(list);
}
function onTouchEnd(e){
  e.preventDefault();
  const list=touchList(e);syncTouches(list);
  if(list.length>=2){V.pinch0=pinchDist(list);V.uz0=V.userZoom;const m=midpoint(list);V.midX=m.x;V.midY=m.y}
  else if(list.length===1){V.midX=list[0].x;V.midY=list[0].y;V.pinch0=0}
  else{V.dragging=false;V.pinch0=0}
}
function onPointerDown(e){
  if(e.pointerType==='touch')return;if(e.button!==0)return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  V.dragging=true;V.vy=0;V.vp=0;V.midX=e.clientX;V.midY=e.clientY;
  const now=performance.now();if(now-V.lastTap<280){resetView();V.lastTap=0}else V.lastTap=now;
}
function onPointerMove(e){if(e.pointerType==='touch'||!V.dragging)return;applyRotate(e.clientX-V.midX,e.clientY-V.midY);V.midX=e.clientX;V.midY=e.clientY}
function onPointerUp(e){if(e.pointerType==='touch')return;V.dragging=false}

['gesturestart','gesturechange','gestureend'].forEach(t=>{document.addEventListener(t,e=>e.preventDefault(),{passive:false})});
document.addEventListener('touchmove',e=>{if(e.target===cv||e.target===document.body||e.target===document.documentElement)e.preventDefault()},{passive:false});

if(hasTouch){
  cv.addEventListener('touchstart',onTouchStart,{passive:false});
  cv.addEventListener('touchmove',onTouchMove,{passive:false});
  cv.addEventListener('touchend',onTouchEnd,{passive:false});
  cv.addEventListener('touchcancel',onTouchEnd,{passive:false});
}else{
  cv.addEventListener('pointerdown',onPointerDown);
  cv.addEventListener('pointermove',onPointerMove);
  cv.addEventListener('pointerup',onPointerUp);
  cv.addEventListener('pointercancel',onPointerUp);
  cv.addEventListener('pointerleave',e=>{if(V.dragging)onPointerUp(e)});
}
cv.addEventListener('wheel',e=>{e.preventDefault();V.userZoom=clampUz(V.userZoom*Math.exp(-e.deltaY*.0015))},{passive:false});
window.addEventListener('resize',()=>size());

document.getElementById('zm').onclick=function(){V.userZoom=clampUz(V.userZoom/1.35)};
document.getElementById('zp').onclick=function(){V.userZoom=clampUz(V.userZoom*1.35)};
document.getElementById('pp').onclick=function(){play=!play;this.textContent=play?'❚❚':'▶'};
document.getElementById('sp').onclick=function(){speed=speed>=8?1:speed*2;this.textContent=speed+'×'};
document.getElementById('rv').onclick=function(){resetView()};
document.getElementById('rs').onclick=function(){restart()};

window.__sphereV=V; window.__sphereMarker=MARKER; window.__sphereRepo=REPO;
window.__ringCount=ringCount; window.__nRings=()=>nRings;
window.__forceRings=function(n){nRings=Math.max(0,Math.min(MAXR,n|0));complete=nRings>=MAXR;T=nRings*RING_MS;nextAt=T+RING_MS;play=false};

size();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
