<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>Prime Ring Rotation</title>
<!-- prime-ring-rotation-v3 -->
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#05080f;overflow:hidden;position:fixed;inset:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;overscroll-behavior:none;outline:none}
#ui{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:2;pointer-events:none}
#ui button{pointer-events:auto;background:rgba(255,255,255,.14);color:#eee;border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:10px 16px;font:17px/1 -apple-system,system-ui,sans-serif;min-width:48px;min-height:48px;-webkit-appearance:none;appearance:none}
#ui button:active{background:rgba(255,255,255,.28)}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
<button type="button" id="zm" aria-label="zoom out">−</button>
<button type="button" id="zp" aria-label="zoom in">+</button>
<button type="button" id="pp" aria-label="pause">❚❚</button>
<button type="button" id="sp" aria-label="speed">1×</button>
<button type="button" id="rv" aria-label="reset view">⟲</button>
<button type="button" id="rs" aria-label="restart">✦</button>
</div>
<script>
(function(){
'use strict';
const MARKER='prime-ring-rotation-v3';
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});

/* ---- primality (32-bit trial; bands are only 360 wide) ---- */
function isP(n){
  if(n<2)return false; if(n%2===0)return n===2; if(n%3===0)return n===3; if(n%5===0)return n===5;
  for(let d=7,w=4;d*d<=n;d+=w,w=6-w) if(n%d===0)return false;
  return true;
}
function bandThetas(g){
  const th=[]; const lo=360*g, hi=lo+360;
  for(let m=lo;m<hi;m++) if(m>5&&isP(m)) th.push((m%360)*Math.PI/180);
  return th;
}

/* Geometry: tilted pole â=(sin T, cos T, 0); base meridian p=cosθ·â+sinθ·Ẑ;
   then rotate about +y by A° clockwise (from above). */
function pointOnRing(Tdeg, Adeg, th){
  const T=Tdeg*Math.PI/180, A=Adeg*Math.PI/180;
  const cth=Math.cos(th), sth=Math.sin(th);
  const sT=Math.sin(T), cT=Math.cos(T), cA=Math.cos(A), sA=Math.sin(A);
  const x0=sT*cth, y0=cT*cth, z0=sth;
  return [x0*cA + z0*sA, y0, -x0*sA + z0*cA];
}
function tiltAxis(Tdeg, Adeg){
  const T=Tdeg*Math.PI/180, A=Adeg*Math.PI/180;
  const sT=Math.sin(T), cT=Math.cos(T), cA=Math.cos(A), sA=Math.sin(A);
  // â=(sT,cT,0) rotated about y by A clockwise
  return [sT*cA, cT, -sT*sA];
}

const PASSES=180, PER=360, TOTAL=PASSES*PER; // 64800
// ~25s per pass at 1× → ~69ms/ring
const RING_MS=70;
const UZ_MIN=.3, UZ_MAX=8;
const MAX_KEEP=900; // rings retained (~30k–45k dots); current pass + decaying trail

/** ring record: {g,T,A,th:Float32Array} */
const rings=[]; // newest at end
let gNext=0, Tclk=0, last=0, play=true, speed=1, complete=false, acc=0;

const V={yaw:.55,pitch:20*Math.PI/180,userZoom:1.35,fit:1.0,dragging:false,vy:0,vp:0,pinch0:0,uz0:1,midX:0,midY:0,lastTap:0};
const touches=new Map();
const hasTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

function hueOf(g){return 330 - 285*((g%PER)/Math.max(1,PER-1));} // pink→gold within each pass
function clampUz(z){return Math.min(UZ_MAX,Math.max(UZ_MIN,z))}
function size(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const W=window.innerWidth||document.documentElement.clientWidth||390;
  const H=window.innerHeight||document.documentElement.clientHeight||844;
  const tw=Math.max(1,Math.round(W*dpr)), th=Math.max(1,Math.round(H*dpr));
  if(cv.width!==tw||cv.height!==th){cv.width=tw;cv.height=th}
  return{dpr,W,H};
}
function applyRotate(dx,dy){V.yaw+=dx*.009;V.pitch=Math.max(-1.55,Math.min(1.55,V.pitch+dy*.009));V.vy=dx*.009;V.vp=dy*.009}
function resetView(){V.userZoom=1.35;V.yaw=.55;V.pitch=20*Math.PI/180;V.vy=0;V.vp=0}
function pushRing(g){
  const T=(g/PER)|0, A=g%PER;
  const th=bandThetas(g);
  rings.push({g,T,A,th:new Float32Array(th)});
  while(rings.length>MAX_KEEP) rings.shift();
}
function restart(){
  rings.length=0; gNext=0; Tclk=0; last=0; acc=0; complete=false; play=true; resetView();
}
/** Jump to end of pass P (0-based), seeding a trail of recent rings. */
function jumpToPassEnd(P){
  P=Math.max(0,Math.min(PASSES-1,P|0));
  rings.length=0;
  const end=P*PER + (PER-1); // inclusive
  const start=Math.max(0, end-(MAX_KEEP-1));
  for(let g=start;g<=end;g++) pushRing(g);
  gNext=end+1;
  complete=gNext>=TOTAL;
  Tclk=0; acc=0; // caller sets play
}

function frame(now){
  requestAnimationFrame(frame);
  const{dpr,W,H}=size();
  const dt=last?Math.min(64,now-last):16; last=now;

  if(play&&!complete){
    acc+=dt*speed;
    while(acc>=RING_MS && !complete){
      acc-=RING_MS;
      pushRing(gNext++);
      if(gNext>=TOTAL){complete=true;play=true}
    }
  }
  Tclk+=dt;

  if(!V.dragging){
    if(Math.abs(V.vy)+Math.abs(V.vp)>.00002){
      V.yaw+=V.vy; V.pitch=Math.max(-1.55,Math.min(1.55,V.pitch+V.vp));
      const damp=Math.pow(.92,dt/16); V.vy*=damp; V.vp*=damp;
    }else if(play){
      V.yaw+=(complete?.0004:.0002)*dt*Math.max(1,speed*.5);
    }
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#05080f'; ctx.fillRect(0,0,W,H);

  const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch);
  // larger sphere: fill more of the frame
  const sc=.52*Math.min(W,H)*V.userZoom/V.fit;
  const D=Math.max(2.0, 3.8/Math.max(1,V.userZoom*.5));
  const near=-D*.92;
  function pr(x,y,z){
    const x1=x*cy+z*sy, z1=-x*sy+z*cy;
    const y2=y*cp-z1*sp, z2=y*sp+z1*cp;
    if(z2<=near)return null;
    const f=D/(D+z2);
    return[W/2+x1*sc*f, H/2-y2*sc*f, z2, f];
  }

  // polar axis
  const pn=pr(0,1.08,0), ps=pr(0,-1.08,0);
  if(pn&&ps){ctx.strokeStyle='rgba(255,200,230,.28)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(pn[0],pn[1]);ctx.lineTo(ps[0],ps[1]);ctx.stroke()}

  // current tilt axis (from newest ring, or next-to-add)
  const cur=rings.length?rings[rings.length-1]:null;
  const Tnow=cur?cur.T:((gNext/PER)|0);
  const Anow=cur?cur.A:(gNext%PER);
  const ax=tiltAxis(Tnow, Anow);
  const t1=pr(ax[0]*1.08,ax[1]*1.08,ax[2]*1.08), t2=pr(-ax[0]*1.08,-ax[1]*1.08,-ax[2]*1.08);
  if(t1&&t2){ctx.strokeStyle='rgba(120,220,255,.35)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(t1[0],t1[1]);ctx.lineTo(t2[0],t2[1]);ctx.stroke()}

  // pink core
  const pc=pr(0,0,0);
  if(pc){
    const g=ctx.createRadialGradient(pc[0],pc[1],0,pc[0],pc[1],22*pc[3]);
    g.addColorStop(0,'rgba(255,120,200,.55)'); g.addColorStop(1,'rgba(255,80,160,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pc[0],pc[1],22*pc[3],0,6.2832); ctx.fill();
    ctx.fillStyle='rgba(255,160,220,.95)'; ctx.beginPath(); ctx.arc(pc[0],pc[1],2.6*pc[3],0,6.2832); ctx.fill();
  }

  ctx.globalCompositeOperation='lighter';
  const n=rings.length;
  // Draw oldest→newest. Trail rings are dimmer; only newest pass gets meridian arcs.
  const curPass=cur?cur.T:-1;
  for(let i=0;i<n;i++){
    const r=rings[i];
    const age=n-1-i; // 0 = newest
    const inCurPass=r.T===curPass;
    // trail: older passes much dimmer; within pass fade by age
    let bright;
    if(age===0) bright=1;
    else if(inCurPass) bright=Math.max(.14, Math.pow(.97,age));
    else bright=Math.max(.04, .18*Math.pow(.992,age));
    const hue=hueOf(r.g);
    const ths=r.th;
    const T=r.T, A=r.A;
    const Td=T*Math.PI/180, Ad=A*Math.PI/180;
    const sT=Math.sin(Td), cT=Math.cos(Td), cA=Math.cos(Ad), sA=Math.sin(Ad);
    const proj=[];
    // subsample trail rings for speed: keep every 2nd point on old passes
    const step=(!inCurPass && age>40)?2:1;
    for(let j=0;j<ths.length;j+=step){
      const th=ths[j], cth=Math.cos(th), sth=Math.sin(th);
      const x0=sT*cth, y0=cT*cth, z0=sth;
      const x=x0*cA+z0*sA, y=y0, z=-x0*sA+z0*cA;
      const p=pr(x,y,z);
      if(!p){proj.push(null);continue}
      proj.push(p);
      const rr=Math.max(.55,1.35*p[3]*(age===0?1.15:1));
      if(age<2){
        ctx.fillStyle='hsla('+hue+',95%,60%,'+(0.2*bright).toFixed(3)+')';
        ctx.beginPath();ctx.arc(p[0],p[1],rr*2.2,0,6.2832);ctx.fill();
      }
      ctx.fillStyle='hsla('+hue+',95%,72%,'+(0.15+0.75*bright).toFixed(3)+')';
      ctx.beginPath();ctx.arc(p[0],p[1],rr,0,6.2832);ctx.fill();
    }
    // meridian arc for recent rings in current pass
    if(inCurPass && age<24){
      ctx.strokeStyle='hsla('+hue+',85%,65%,'+(0.14*bright).toFixed(3)+')';
      ctx.lineWidth=age===0?1.35:.5;
      ctx.beginPath(); let started=false;
      for(let j=0;j<proj.length;j++){
        const p=proj[j]; if(!p){started=false;continue}
        if(!started){ctx.moveTo(p[0],p[1]);started=true} else ctx.lineTo(p[0],p[1]);
      }
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
}

/* ---- touchctl-v2 input ---- */
function touchList(e){const a=[];for(let i=0;i<e.touches.length;i++){const t=e.touches[i];a.push({id:t.identifier,x:t.clientX,y:t.clientY})}return a}
function syncTouches(list){touches.clear();for(const t of list)touches.set(t.id,{x:t.x,y:t.y})}
function pinchDist(list){if(list.length<2)return 0;return Math.hypot(list[0].x-list[1].x,list[0].y-list[1].y)}
function midpoint(list){if(list.length<2)return{x:list[0].x,y:list[0].y};return{x:(list[0].x+list[1].x)/2,y:(list[0].y+list[1].y)/2}}
function onTouchStart(e){
  e.preventDefault(); const list=touchList(e);
  if(list.length===1&&e.changedTouches.length===1){const now=performance.now();if(now-V.lastTap<280){resetView();V.lastTap=0}else V.lastTap=now}
  V.dragging=true;V.vy=0;V.vp=0;syncTouches(list);
  if(list.length>=2){V.pinch0=pinchDist(list);V.uz0=V.userZoom;const m=midpoint(list);V.midX=m.x;V.midY=m.y}
  else if(list.length===1){V.midX=list[0].x;V.midY=list[0].y}
}
function onTouchMove(e){
  e.preventDefault(); const list=touchList(e); if(!list.length)return;
  if(list.length>=2){const d=pinchDist(list);if(V.pinch0>0)V.userZoom=clampUz(V.uz0*(d/V.pinch0));const m=midpoint(list);applyRotate(m.x-V.midX,m.y-V.midY);V.midX=m.x;V.midY=m.y}
  else{const t=list[0];applyRotate(t.x-V.midX,t.y-V.midY);V.midX=t.x;V.midY=t.y}
  syncTouches(list);
}
function onTouchEnd(e){
  e.preventDefault(); const list=touchList(e); syncTouches(list);
  if(list.length>=2){V.pinch0=pinchDist(list);V.uz0=V.userZoom;const m=midpoint(list);V.midX=m.x;V.midY=m.y}
  else if(list.length===1){V.midX=list[0].x;V.midY=list[0].y;V.pinch0=0}
  else{V.dragging=false;V.pinch0=0}
}
function onPointerDown(e){
  if(e.pointerType==='touch')return; if(e.button!==0)return; e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  V.dragging=true;V.vy=0;V.vp=0;V.midX=e.clientX;V.midY=e.clientY;
  const now=performance.now(); if(now-V.lastTap<280){resetView();V.lastTap=0}else V.lastTap=now;
}
function onPointerMove(e){if(e.pointerType==='touch'||!V.dragging)return;applyRotate(e.clientX-V.midX,e.clientY-V.midY);V.midX=e.clientX;V.midY=e.clientY}
function onPointerUp(e){if(e.pointerType==='touch')return;V.dragging=false}

['gesturestart','gesturechange','gestureend'].forEach(t=>{document.addEventListener(t,e=>e.preventDefault(),{passive:false})});
document.addEventListener('touchmove',e=>{if(e.target===cv||e.target===document.body||e.target===document.documentElement)e.preventDefault()},{passive:false});
if(hasTouch){
  cv.addEventListener('touchstart',onTouchStart,{passive:false});
  cv.addEventListener('touchmove',onTouchMove,{passive:false});
  cv.addEventListener('touchend',onTouchEnd,{passive:false});
  cv.addEventListener('touchcancel',onTouchEnd,{passive:false});
}else{
  cv.addEventListener('pointerdown',onPointerDown);
  cv.addEventListener('pointermove',onPointerMove);
  cv.addEventListener('pointerup',onPointerUp);
  cv.addEventListener('pointercancel',onPointerUp);
  cv.addEventListener('pointerleave',e=>{if(V.dragging)onPointerUp(e)});
}
cv.addEventListener('wheel',e=>{e.preventDefault();V.userZoom=clampUz(V.userZoom*Math.exp(-e.deltaY*.0015))},{passive:false});
window.addEventListener('resize',()=>size());

document.getElementById('zm').onclick=function(){V.userZoom=clampUz(V.userZoom/1.35)};
document.getElementById('zp').onclick=function(){V.userZoom=clampUz(V.userZoom*1.35)};
document.getElementById('pp').onclick=function(){play=!play;this.textContent=play?'❚❚':'▶'};
document.getElementById('sp').onclick=function(){speed=speed>=16?1:speed===1?4:16;this.textContent=speed+'×'};
document.getElementById('rv').onclick=function(){resetView()};
document.getElementById('rs').onclick=function(){restart()};

window.__sphereV=V; window.__sphereMarker=MARKER;
window.__rings=()=>rings; window.__gNext=()=>gNext; window.__jumpToPassEnd=jumpToPassEnd;
window.__bandCount=function(g){return bandThetas(g).length};
window.__pointOnRing=pointOnRing;

// URL ?jump=N → end of pass N (for screenshots / testing)
const jumpParam=new URLSearchParams(location.search).get('jump');
if(jumpParam!==null && jumpParam!==''){
  jumpToPassEnd(+jumpParam);
  play=false; // freeze for inspection / screenshots
  const pp=document.getElementById('pp'); if(pp) pp.textContent='▶';
}

size();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
